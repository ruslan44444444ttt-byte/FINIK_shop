<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxDrop - Симулятор кейсов и Магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        header {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #8b949e;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #58a6ff;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance-badge {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 700;
            color: #3fb950;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .profile-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .profile-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        /* Основной контент */
        main {
            flex: 1;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Страница кейсов */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .case-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .case-card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
        }

        .case-img {
            font-size: 60px;
            margin: 15px 0;
        }

        .case-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: #2ea043;
        }

        /* Страница магазина */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-img {
            font-size: 50px;
            margin: 10px 0;
        }

        .item-name {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .item-price {
            color: #3fb950;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .inventory-item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            position: relative;
        }

        .inventory-item .item-price {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .sell-btn {
            background: #da3633;
            padding: 6px 12px;
            font-size: 12px;
        }
        .sell-btn:hover {
            background: #f85149;
        }

        /* Модальные окна */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 20px;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #ffffff;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Анимация кейса */
        .opening-container {
            text-align: center;
            padding: 20px 0;
        }

        .roulette-window {
            width: 100%;
            height: 120px;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin: 20px 0;
            display: flex;
            align-items: center;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            transition: left cubic-bezier(0.1, 0.8, 0.1, 1) 4s;
        }

        .roulette-item {
            min-width: 110px;
            height: 100px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            margin: 0 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 13px;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: #f85149;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Элементы админки */
        .admin-controls {
            margin-top: 20px;
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #f85149;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
        }

        .btn-danger {
            background: #da3633;
        }
        .btn-danger:hover {
            background: #f85149;
        }
        
        .btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover {
            background: #30363d;
        }

        /* Стили отзывов */
        .reviews-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .review-card {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 10px 12px;
            border-radius: 6px;
        }

        .review-author {
            font-weight: 700;
            font-size: 13px;
            color: #58a6ff;
            margin-bottom: 3px;
        }

        .review-text {
            font-size: 13px;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="logo" onclick="switchTab('cases')">BloxDrop</div>
        <ul class="nav-links">
            <li><a onclick="switchTab('cases')" class="active" id="nav-cases">Кейсы</a></li>
            <li><a onclick="switchTab('store')" id="nav-store">Магазин</a></li>
            <li><a onclick="switchTab('inventory')" id="nav-inventory">Инвентарь</a></li>
        </ul>
        <div class="user-panel">
            <div class="balance-badge">💰 <span id="user-balance">1000</span> R$</div>
            <button class="profile-btn" onclick="openProfileModal()">Профиль</button>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <!-- Вкладка: Кейсы -->
        <section id="tab-cases" class="tab-content active">
            <div class="cases-grid" id="cases-container">
                <!-- Динамически заполняется через JS -->
            </div>
        </section>

        <!-- Вкладка: Магазин -->
        <section id="tab-store" class="tab-content">
            <div class="store-grid" id="store-container">
                <!-- Динамически заполняется через JS -->
            </div>
        </section>

        <!-- Вкладка: Инвентарь -->
        <section id="tab-inventory" class="tab-content">
            <div class="inventory-grid" id="inventory-container">
                <!-- Динамически заполняется через JS -->
            </div>
        </section>
    </main>

    <!-- Модальное окно профиля / панели управления -->
    <div class="modal" id="profile-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeProfileModal()">&times;</button>
            <div class="modal-title" id="profile-modal-title">Личный кабинет</div>
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn btn-secondary" onclick="openReviewsModal()">⭐ Отзывы</button>
                <button class="btn btn-secondary" onclick="toggleAdminPanel()">⚙️ Админ-панель</button>
            </div>

            <div class="admin-controls" id="admin-panel" style="display: none;">
                <h4 style="margin-bottom: 10px; color: #f85149; font-size: 15px;">Панель администратора</h4>
                <div class="form-group">
                    <label>Добавить R$ на баланс</label>
                    <button class="btn" onclick="adminAddMoney()" style="padding: 6px;">+5000 R$</button>
                </div>
                <div class="form-group">
                    <label>Сбросить инвентарь</label>
                    <button class="btn btn-danger" onclick="adminClearInventory()" style="padding: 6px;">Очистить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно отзывов -->
    <div class="modal" id="reviews-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeReviewsModal()">&times;</button>
            <div class="modal-title">Отзывы игроков</div>
            
            <div class="reviews-list" id="reviews-container">
                <!-- Список отзывов -->
            </div>

            <div class="form-group">
                <input type="text" id="review-input" placeholder="Напишите ваш отзыв...">
            </div>
            <button class="btn" onclick="submitReview()">Отправить отзыв</button>
        </div>
    </div>

    <!-- Модальное окно открытия кейса -->
    <div class="modal" id="case-modal">
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-modal" onclick="closeCaseModal()">&times;</button>
            <div class="modal-title" id="opening-case-title">Открытие кейса</div>
            
            <div class="opening-container">
                <div class="roulette-window">
                    <div class="roulette-pointer"></div>
                    <div class="roulette-track" id="roulette-track"></div>
                </div>
                <button class="btn" id="start-spin-btn" onclick="startSpinning()">Открыть кейс</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно изменения цены товара (для админов) -->
    <div class="modal" id="edit-price-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeEditPriceModal()">&times;</button>
            <div class="modal-title">Изменить цену товара</div>
            <div class="form-group">
                <label>Новая цена (R$)</label>
                <input type="number" id="new-item-price-input" min="1">
            </div>
            <button class="btn" onclick="saveNewItemPrice()">Сохранить</button>
        </div>
    </div>

    <script>
        // Данные приложения
        let balance = 1000;
        let inventory = [];
        let reviews = [
            { author: "RobloxPro_2026", text: "Отличный сайт! Выбил легендарку с третьего кейса!" },
            { author: "BuilderMan", text: "Классная рулетка, всё честно работает." }
        ];

        let casesData = [
            { id: 1, name: "Новичок", price: 50, icon: "📦", items: [
                { name: "Обычная футболка", price: 15, icon: "👕" },
                { name: "Кепка", price: 25, icon: "🧢" },
                { name: "Штаны", price: 35, icon: "👖" },
                { name: "Очки", price: 60, icon: "🕶️" },
                { name: "Кроссовки", price: 100, icon: "👟" }
            ]},
            { id: 2, name: "Эпический", price: 200, icon: "💼", items: [
                { name: "Рюкзак Roblox", price: 80, icon: "🎒" },
                { name: "Шлем рыцаря", price: 180, icon: "🪖" },
                { name: "Золотая цепь", price: 300, icon: "👑" },
                { name: "Неоновый меч", price: 500, icon: "🗡️" }
            ]},
            { id: 3, name: "Легендарный", price: 600, icon: "🎁", items: [
                { name: "Доминиус", price: 1200, icon: "💠" },
                { name: "Валькирия", price: 2500, icon: "✨" },
                { name: "Феникс", price: 5000, icon: "🔥" }
            ]}
        ];

        let storeData = [
            { id: 1, name: "Обычная футболка", price: 20, icon: "👕" },
            { id: 2, name: "Кепка", price: 35, icon: "🧢" },
            { id: 3, name: "Штаны", price: 45, icon: "👖" },
            { id: 4, name: "Рюкзак Roblox", price: 100, icon: "🎒" },
            { id: 5, name: "Шлем рыцаря", price: 220, icon: "🪖" },
            { id: 6, name: "Золотая цепь", price: 350, icon: "👑" },
            { id: 7, name: "Доминиус", price: 1500, icon: "💠" }
        ];

        let currentActiveCase = null;
        let isSpinning = false;
        let editingStoreItemId = null;
        let isAdmin = false; // Режим админа включается по желанию

        // Инициализация при загрузке
        window.onload = function() {
            renderCases();
            renderStore();
            renderInventory();
            renderReviews();
            updateBalanceUI();
        };

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            if(document.getElementById(`nav-${tabName}`)) {
                document.getElementById(`nav-${tabName}`).classList.add('active');
            }
        }

        function updateBalanceUI() {
            document.getElementById('user-balance').innerText = balance;
        }

        // Отрисовка кейсов
        function renderCases() {
            const container = document.getElementById('cases-container');
            container.innerHTML = '';
            casesData.forEach(c => {
                container.innerHTML += `
                    <div class="case-card">
                        <div>
                            <div class="case-img">${c.icon}</div>
                            <div class="case-title">${c.name}</div>
                        </div>
                        <div>
                            <div style="color: #3fb950; font-weight: 700; margin-bottom: 12px;">${c.price} R$</div>
                            <button class="btn" onclick="openCaseModal(${c.id})">Открыть</button>
                        </div>
                    </div>
                `;
            });
        }

        // Отрисовка магазина
        function renderStore() {
            const container = document.getElementById('store-container');
            container.innerHTML = '';
            storeData.forEach(item => {
                let adminEditBtn = isAdmin ? `<button class="btn btn-secondary" onclick="openEditPriceModal(${item.id})" style="margin-top: 8px; font-size: 12px; padding: 5px;">✏️ Изменить цену</button>` : '';
                container.innerHTML += `
                    <div class="item-card">
                        <div>
                            <div class="item-img">${item.icon}</div>
                            <div class="item-name">${item.name}</div>
                        </div>
                        <div>
                            <div class="item-price">${item.price} R$</div>
                            <button class="btn" onclick="buyItem(${item.id})">Купить</button>
                            ${adminEditBtn}
                        </div>
                    </div>
                `;
            });
        }

        // Отрисовка инвентаря
        function renderInventory() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = '';
            if (inventory.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #8b949e; padding: 40px;">Ваш инвентарь пуст</div>`;
                return;
            }
            inventory.forEach((item, index) => {
                container.innerHTML += `
                    <div class="inventory-item">
                        <div class="item-img" style="font-size: 40px;">${item.icon}</div>
                        <div class="item-name" style="font-size: 13px;">${item.name}</div>
                        <div class="item-price">${item.price} R$</div>
                        <button class="btn sell-btn" onclick="sellItem(${index})">Продать</button>
                    </div>
                `;
            });
        }

        // Отрисовка отзывов
        function renderReviews() {
            const container = document.getElementById('reviews-container');
            container.innerHTML = '';
            reviews.forEach(r => {
                container.innerHTML += `
                    <div class="review-card">
                        <div class="review-author">${r.author}</div>
                        <div class="review-text">${r.text}</div>
                    </div>
                `;
            });
        }

        // Логика покупки в магазине
        function buyItem(id) {
            const item = storeData.find(i => i.id === id);
            if (balance < item.price) {
                alert("Недостаточно Robux на балансе!");
                return;
            }
            balance -= item.price;
            inventory.push({ ...item });
            updateBalanceUI();
            renderInventory();
            alert(`Вы успешно купили: ${item.name}!`);
        }

        // Продажа из инвентаря
        function sellItem(index) {
            const item = inventory[index];
            balance += item.price;
            inventory.splice(index, 1);
            updateBalanceUI();
            renderInventory();
        }

        // Управление модальными окнами профиля и отзывов
        function openProfileModal() {
            document.getElementById('profile-modal').classList.add('active');
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.remove('active');
        }

        function openReviewsModal() {
            closeProfileModal();
            document.getElementById('reviews-modal').classList.add('active');
        }

        function closeReviewsModal() {
            document.getElementById('reviews-modal').classList.remove('active');
        }

        function toggleAdminPanel() {
            isAdmin = true;
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            renderStore(); // Обновляем магазин, чтобы появились кнопки редактирования
        }

        // Отправка отзыва
        function submitReview() {
            const input = document.getElementById('review-input');
            const text = input.value.trim();
            if (!text) return;
            reviews.unshift({ author: "Игрок #" + Math.floor(Math.random() * 8999 + 1000), text: text });
            input.value = '';
            renderReviews();
        }

        // Изменение цены товара без удаления
        function openEditPriceModal(id) {
            editingStoreItemId = id;
            const item = storeData.find(i => i.id === id);
            document.getElementById('new-item-price-input').value = item.price;
            document.getElementById('edit-price-modal').classList.add('active');
        }

        function closeEditPriceModal() {
            document.getElementById('edit-price-modal').classList.remove('active');
            editingStoreItemId = null;
        }

        function saveNewItemPrice() {
            const newPrice = parseInt(document.getElementById('new-item-price-input').value);
            if (isNaN(newPrice) || newPrice <= 0) {
                alert("Введите корректную цену!");
                return;
            }
            const item = storeData.find(i => i.id === editingStoreItemId);
            if (item) {
                item.price = newPrice;
            }
            closeEditPriceModal();
            renderStore();
            alert("Цена товара успешно обновлена!");
        }

        // Функции админки
        function adminAddMoney() {
            balance += 5000;
            updateBalanceUI();
            alert("Начислено 5000 R$!");
        }

        function adminClearInventory() {
            inventory = [];
            renderInventory();
            alert("Инвентарь очищен!");
        }

        // Логика открытия кейсов (Рулетка)
        function openCaseModal(id) {
            currentActiveCase = casesData.find(c => c.id === id);
            if (balance < currentActiveCase.price) {
                alert("Недостаточно средств для открытия кейса!");
                return;
            }
            document.getElementById('opening-case-title').innerText = `Кейс: ${currentActiveCase.name}`;
            setupRouletteTrack(currentActiveCase.items);
            document.getElementById('start-spin-btn').style.display = 'block';
            document.getElementById('case-modal').classList.add('active');
        }

        function closeCaseModal() {
            if (isSpinning) return;
            document.getElementById('case-modal').classList.remove('active');
        }

        function setupRouletteTrack(items) {
            const track = document.getElementById('roulette-track');
            track.style.transition = 'none';
            track.style.left = '0px';
            
            let html = '';
            // Генерируем длинную ленту случайных элементов для прокрутки
            for (let i = 0; i < 50; i++) {
                const randomItem = items[Math.floor(Math.random() * items.length)];
                html += `
                    <div class="roulette-item">
                        <div style="font-size: 35px;">${randomItem.icon}</div>
                        <div style="margin-top: 5px; font-weight: 600;">${randomItem.price} R$</div>
                    </div>
                `;
            }
            track.innerHTML = html;
        }

        function startSpinning() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('start-spin-btn').style.display = 'none';

            balance -= currentActiveCase.price;
            updateBalanceUI();

            const track = document.getElementById('roulette-track');
            
            // Вычисляем выигрышный элемент (например, 35-й по счету)
            const winningIndex = 35;
            const itemWidth = 120; // 110px ширина + 10px суммарный отступ (margin 5px * 2)
            const windowWidth = document.querySelector('.roulette-window').offsetWidth;
            
            // Позиция центра для остановки ровно под красным указателем
            const targetLeft = -(winningIndex * itemWidth) + (windowWidth / 2) - (itemWidth / 2);

            track.style.transition = 'left cubic-bezier(0.08, 0.82, 0.12, 1) 4s';
            track.style.left = `${targetLeft}px`;

            setTimeout(() => {
                isSpinning = false;
                // Определяем выигравший предмет на основе ленты
                const items = currentActiveCase.items;
                const wonItem = items[Math.floor(Math.random() * items.length)];
                
                inventory.push({ ...wonItem });
                renderInventory();

                alert(`Поздравляем! Вы выиграли: ${wonItem.name} (${wonItem.price} R$)`);
                document.getElementById('case-modal').classList.remove('active');
            }, 4100);
        }
    </script>
</body>
</html>
