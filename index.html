<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Store - Adopt Me & MM2</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1e1e1e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #00cc99;
        }

        .btn-secondary {
            background-color: #333;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background-color: #444;
        }

        main {
            flex: 1;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .category-btn {
            background-color: #1e1e1e;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .category-btn.active {
            background-color: #00ffcc;
            color: #121212;
            border-color: #00ffcc;
            font-weight: bold;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .product-price {
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* Модальные окна */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 14px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
        }

        .reviews-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .review-item {
            background: #121212;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }

        .review-author {
            font-weight: bold;
            color: #00ffcc;
            font-size: 13px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Roblox Shop</div>
        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="openProfileModal()">👤 Профиль</button>
        </div>
    </header>

    <main>
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all', this)">Все товары</button>
            <button class="category-btn" onclick="filterCategory('adoptme', this)">Adopt Me</button>
            <button class="category-btn" onclick="filterCategory('mm2', this)">MM2</button>
        </div>

        <div class="products-grid" id="products-container">
            <!-- Товары загружаются через JS / Firebase -->
        </div>
    </main>

    <!-- Модальное окно профиля / админки -->
    <div class="modal" id="profile-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('profile-modal')">&times;</button>
            <h2>Личный кабинет</h2>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button class="btn btn-secondary" onclick="openReviewsModal()">⭐ Отзывы</button>
                <button class="btn" onclick="openAdminLogin()">⚙️ Админ-панель</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно отзывов -->
    <div class="modal" id="reviews-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('reviews-modal')">&times;</button>
            <h2>Отзывы покупателей</h2>
            <div class="reviews-list" id="reviews-container">
                <!-- Отзывы -->
            </div>
            <div class="form-group">
                <input type="text" id="review-author-input" placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <textarea id="review-text-input" placeholder="Ваш отзыв..." rows="2"></textarea>
            </div>
            <button class="btn" onclick="addReview()">Оставить отзыв</button>
        </div>
    </div>

    <!-- Модальное окно админ-панели -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('admin-modal')">&times;</button>
            <h2>Панель администратора</h2>
            
            <div id="admin-login-form" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Пароль администратора</label>
                    <input type="password" id="admin-password">
                </div>
                <button class="btn" onclick="checkAdminPassword()">Войти</button>
            </div>

            <div id="admin-panel-content" style="display: none; margin-top: 15px;">
                <h3 style="margin-bottom: 10px; font-size: 15px; color: #00ffcc;">Добавить новый товар</h3>
                <div class="form-group">
                    <label>Название товара</label>
                    <input type="text" id="new-title">
                </div>
                <div class="form-group">
                    <label>Цена (грн)</label>
                    <input type="number" id="new-price">
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="new-category">
                        <option value="adoptme">Adopt Me</option>
                        <option value="mm2">MM2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ссылка на фото</label>
                    <input type="text" id="new-image">
                </div>
                <button class="btn" onclick="addProduct()">Добавить товар</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно изменения цены товара -->
    <div class="modal" id="edit-price-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('edit-price-modal')">&times;</button>
            <h2>Изменить цену товара</h2>
            <div class="form-group" style="margin-top: 15px;">
                <label>Новая цена (грн)</label>
                <input type="number" id="edit-price-input">
            </div>
            <button class="btn" onclick="saveEditedPrice()">Сохранить цену</button>
        </div>
    </div>

    <!-- Модальное окно покупки / связи с продавцом -->
    <div class="modal" id="buy-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('buy-modal')">&times;</button>
            <h2>Покупка товара</h2>
            <p id="buy-product-info" style="margin: 15px 0; color: #aaa;"></p>
            <p style="margin-bottom: 15px; font-size: 14px;">Для покупки напишите продавцу в Telegram:</p>
            <a href="https://t.me/ваш_логин" target="_blank" class="btn" style="display: block; text-align: center; text-decoration: none;">Написать в Telegram</a>
        </div>
    </div>

    <script>
        // Инициализация Firebase (замените на ваши данные из Firebase Console при необходимости)
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-app",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };
        
        // Проверка инициализации, если конфиг пустой — используем локальный массив для теста
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch(e) {
            console.log("Firebase not configured yet, running local simulation");
        }

        // Локальное хранилище для отзывов и товаров (если Firebase не подключен)
        let localProducts = [
            { id: "1", title: "Shadow Dragon (FR)", price: 350, category: "adoptme", image: "https://via.placeholder.com/220x150/2a2a2a/00ffcc?text=Shadow+Dragon" },
            { id: "2", title: "Bat Dragon", price: 300, category: "adoptme", image: "https://via.placeholder.com/220x150/2a2a2a/00ffcc?text=Bat+Dragon" },
            { id: "3", title: "Laser (MM2 Godly)", price: 80, category: "mm2", image: "https://via.placeholder.com/220x150/2a2a2a/00ffcc?text=Laser+MM2" }
        ];

        let localReviews = [
            { author: "Игрок123", text: "Быстро передали питомца в Adopt Me, всё супер!" },
            { author: "RobloxFan", text: "Купил гадли, продавец ответил сразу. Рекомендую!" }
        ];

        let isAdminLoggedIn = false;
        let editingProductId = null;
        let currentFilter = 'all';

        window.onload = function() {
            loadProducts();
            loadReviews();
        };

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openProfileModal() {
            openModal('profile-modal');
        }

        function openReviewsModal() {
            closeModal('profile-modal');
            openModal('reviews-modal');
        }

        function openAdminLogin() {
            closeModal('profile-modal');
            openModal('admin-modal');
        }

        function checkAdminPassword() {
            const pass = document.getElementById('admin-password').value;
            if (pass === "admin123") { // Ваш пароль администратора
                isAdminLoggedIn = true;
                document.getElementById('admin-login-form').style.display = 'none';
                document.getElementById('admin-panel-content').style.display = 'block';
                loadProducts();
                alert("Успешный вход в админ-панель!");
            } else {
                alert("Неверный пароль!");
            }
        }

        function filterCategory(category, btn) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadProducts();
        }

        // Загрузка товаров
        function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            let filtered = localProducts;
            if (currentFilter !== 'all') {
                filtered = localProducts.filter(p => p.category === currentFilter);
            }

            filtered.forEach(product => {
                let adminButtons = '';
                if (isAdminLoggedIn) {
                    adminButtons = `<button class="btn btn-secondary" onclick="openEditPriceModal('${product.id}')" style="margin-top: 8px; width: 100%; font-size: 13px;">✏️ Изменить цену</button>`;
                }

                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${product.image || 'https://via.placeholder.com/220x150'}" class="product-img" alt="item">
                            <div class="product-info">
                                <div class="product-title">${product.title}</div>
                                <div class="product-price">${product.price} грн</div>
                            </div>
                        </div>
                        <div style="padding: 0 15px 15px 15px;">
                            <button class="btn" onclick="openBuyModal('${product.title}', ${product.price})" style="width: 100%;">Купить</button>
                            ${adminButtons}
                        </div>
                    </div>
                `;
            });
        }

        // Изменение цены товара без удаления
        function openEditPriceModal(id) {
            editingProductId = id;
            const product = localProducts.find(p => p.id === id);
            document.getElementById('edit-price-input').value = product.price;
            openModal('edit-price-modal');
        }

        function saveEditedPrice() {
            const newPrice = parseFloat(document.getElementById('edit-price-input').value);
            if (isNaN(newPrice) || newPrice <= 0) {
                alert("Введите корректную цену!");
                return;
            }

            const product = localProducts.find(p => p.id === editingProductId);
            if (product) {
                product.price = newPrice;
            }

            closeModal('edit-price-modal');
            loadProducts();
            alert("Цена успешно изменена!");
        }

        // Добавление товара (Админ)
        function addProduct() {
            const title = document.getElementById('new-title').value;
            const price = parseFloat(document.getElementById('new-price').value);
            const category = document.getElementById('new-category').value;
            const image = document.getElementById('new-image').value;

            if (!title || isNaN(price)) {
                alert("Заполните название и цену!");
                return;
            }

            const newProduct = {
                id: Date.now().toString(),
                title,
                price,
                category,
                image
            };

            localProducts.push(newProduct);
            loadProducts();
            
            document.getElementById('new-title').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-image').value = '';
            closeModal('admin-modal');
            alert("Товар успешно добавлен!");
        }

        // Отзывы
        function loadReviews() {
            const container = document.getElementById('reviews-container');
            container.innerHTML = '';
            localReviews.forEach(r => {
                container.innerHTML += `
                    <div class="review-item">
                        <div class="review-author">${r.author}</div>
                        <div style="font-size: 13px; color: #ccc;">${r.text}</div>
                    </div>
                `;
            });
        }

        function addReview() {
            const author = document.getElementById('review-author-input').value.trim();
            const text = document.getElementById('review-text-input').value.trim();

            if (!author || !text) {
                alert("Заполните имя и текст отзыва!");
                return;
            }

            localReviews.unshift({ author, text });
            loadReviews();

            document.getElementById('review-author-input').value = '';
            document.getElementById('review-text-input').value = '';
            alert("Спасибо за ваш отзыв!");
        }

        function openBuyModal(title, price) {
            document.getElementById('buy-product-info').innerText = `Вы выбрали: ${title} — ${price} грн`;
            openModal('buy-modal');
        }
    </script>
</body>
</html>
