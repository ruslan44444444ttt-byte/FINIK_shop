<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox Store — Adopt Me & MM2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Подключение Firebase SDK (App, Realtime Database) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDuotWstgVYf-TLgJzywcqAvprBUBI1fdA",
        authDomain: "finik-shop-2f147.firebaseapp.com",
        databaseURL: "https://finik-shop-2f147-default-rtdb.firebaseio.com",
        projectId: "finik-shop-2f147",
        storageBucket: "finik-shop-2f147.appspot.com",
        messagingSenderId: "987256885592",
        appId: "1:987256885592:web:26ec42abf9a3f8c7ab152d",
        measurementId: "G-QLSPW1DE8Q"
      };

      try {
        const app = initializeApp(firebaseConfig);
        const rtdb = getDatabase(app);
        
        window.rtdb = rtdb;
        window.fb = { ref, push, onValue, remove };
        window.firebaseReady = true;
        
        if (typeof window.onFirebaseLoaded === 'function') {
            window.onFirebaseLoaded();
        }
      } catch (e) {
        console.error("Ошибка Firebase:", e);
      }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Шапка сайта -->
    <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex justify-between items-center w-full sm:w-auto">
                <h1 class="text-xl font-black text-indigo-400 tracking-wide flex items-center gap-2 cursor-pointer" onclick="switchTab('adopt')">
                    <i class="fa-solid fa-gamepad text-2xl"></i> Roblox Store
                </h1>
                <span id="admin-badge" class="hidden text-xs bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-full font-bold border border-amber-500/30">
                    <i class="fa-solid fa-crown me-1"></i>Админ
                </span>
            </div>
            
            <nav class="flex w-full sm:w-auto gap-1.5 text-xs sm:text-sm font-semibold overflow-x-auto pb-1 sm:pb-0">
                <button type="button" onclick="switchTab('adopt')" id="btn-adopt" class="flex-1 sm:flex-initial px-3.5 py-2.5 rounded-xl transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 text-center whitespace-nowrap active:scale-95">
                    Adopt Me
                </button>
                <button type="button" onclick="switchTab('mm2')" id="btn-mm2" class="flex-1 sm:flex-initial px-3.5 py-2.5 rounded-xl transition bg-slate-700/60 text-slate-300 hover:bg-slate-700 text-center whitespace-nowrap active:scale-95">
                    MM2
                </button>
                <button type="button" onclick="switchTab('reviews')" id="btn-reviews" class="flex-1 sm:flex-initial px-3.5 py-2.5 rounded-xl transition bg-slate-700/60 text-slate-300 hover:bg-slate-700 text-center whitespace-nowrap active:scale-95">
                    Отзывы
                </button>
                <button type="button" onclick="switchTab('admin')" id="btn-admin" class="px-3 py-2.5 rounded-xl transition bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500/20 flex items-center justify-center gap-1.5 whitespace-nowrap active:scale-95">
                    <i class="fa-solid fa-lock text-xs"></i><span>Админка</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Секция Магазина (Adopt Me / MM2) -->
        <section id="shop-section">
            <div class="flex justify-between items-center mb-6">
                <h2 id="section-title" class="text-2xl font-bold text-indigo-300">Adopt Me</h2>
                <span id="items-count" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400">0 товаров</span>
            </div>
            
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6">
                <!-- Товары создаются здесь -->
            </div>

            <div id="empty-shop-state" class="hidden text-center py-12 bg-slate-800/40 rounded-2xl border border-dashed border-slate-700 my-4">
                <i class="fa-solid fa-box-open text-4xl text-slate-600 mb-3"></i>
                <p class="text-slate-400 font-medium">Товаров в этой категории пока нет</p>
            </div>
        </section>

        <!-- Секция Отзывов -->
        <section id="reviews-section" class="hidden max-w-2xl mx-auto space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold text-indigo-300 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-star text-amber-400"></i> Оставить отзыв
                </h2>
                <form id="review-form" onsubmit="handleSaveReview(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Ваше имя / Никнейм</label>
                        <input type="text" id="rev-author" required placeholder="Например: Player_123" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Оценка</label>
                        <select id="rev-rating" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-amber-400 font-bold focus:outline-none focus:border-indigo-500">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5) — Отлично!</option>
                            <option value="4">⭐⭐⭐⭐ (4/5) — Хорошо</option>
                            <option value="3">⭐⭐⭐ (3/5) — Нормально</option>
                            <option value="2">⭐⭐ (2/5) — Плохо</option>
                            <option value="1">⭐ (1/5) — Ужасно</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Ваш отзыв</label>
                        <textarea id="rev-text" required rows="3" placeholder="Напишите впечатления о покупке..." class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                    <button type="submit" id="btn-review-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 active:scale-95">
                        Отправить отзыв
                    </button>
                </form>
            </div>

            <div class="space-y-4">
                <h3 class="text-lg font-bold text-slate-200">Все отзывы</h3>
                <div id="reviews-list" class="space-y-3">
                    <!-- Отзывы загрузятся сюда -->
                </div>
            </div>
        </section>

        <!-- Секция Админ-панели -->
        <section id="admin-section" class="hidden">
            <!-- Окно авторизации -->
            <div id="admin-login" class="max-w-md mx-auto bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-700 shadow-xl my-4">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-amber-500/10 rounded-2xl border border-amber-500/30 flex items-center justify-center mx-auto mb-3 text-amber-400 text-2xl">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-100">Панель Администратора</h2>
                    <p class="text-xs text-slate-400 mt-1">Введите пароль для выкладывания товаров</p>
                </div>
                
                <form id="login-form" onsubmit="handleCheckAdminPass(event)" class="space-y-4">
                    <div>
                        <input type="password" id="admin-pass" autocomplete="current-password" placeholder="Пароль администратора..." required class="w-full p-3.5 rounded-xl bg-slate-900 border border-slate-700 focus:outline-none focus:border-amber-400 text-white placeholder-slate-500">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 active:scale-95">
                        Войти в панель
                    </button>
                </form>
            </div>

            <!-- Форма добавления товаров -->
            <div id="admin-panel" class="hidden max-w-lg mx-auto bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-700 shadow-xl my-4">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                    <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> Опубликовать товар
                    </h2>
                    <button type="button" onclick="handleLogoutAdmin()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg active:scale-95">
                        Выйти
                    </button>
                </div>

                <form id="product-form" onsubmit="handleSaveProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase">Выберите вкладку (слайд)</label>
                        <select id="prod-category" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
                            <option value="adopt">Adopt Me</option>
                            <option value="mm2">MM2</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase">Название товара</label>
                        <input type="text" id="prod-title" required placeholder="Например: Fly Ride Frost Dragon" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase">Цена (в грн / ₴)</label>
                        <input type="number" id="prod-price" min="1" step="any" required placeholder="150" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase">Фотография из галереи</label>
                        <input type="file" id="prod-img" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-900 p-2 rounded-xl border border-slate-700">
                    </div>

                    <button type="submit" id="btn-prod-submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20 active:scale-95 mt-2">
                        Опубликовать товар
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script>
        let currentTab = 'adopt';
        let isAdmin = false;

        function switchTab(tab) {
            currentTab = tab;
            
            const btnAdopt = document.getElementById('btn-adopt');
            const btnMm2 = document.getElementById('btn-mm2');
            const btnReviews = document.getElementById('btn-reviews');

            const activeStyle = 'flex-1 sm:flex-initial px-3.5 py-2.5 rounded-xl transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 text-center whitespace-nowrap active:scale-95';
            const inactiveStyle = 'flex-1 sm:flex-initial px-3.5 py-2.5 rounded-xl transition bg-slate-700/60 text-slate-300 hover:bg-slate-700 text-center whitespace-nowrap active:scale-95';

            btnAdopt.className = tab === 'adopt' ? activeStyle : inactiveStyle;
            btnMm2.className = tab === 'mm2' ? activeStyle : inactiveStyle;
            btnReviews.className = tab === 'reviews' ? activeStyle : inactiveStyle;

            document.getElementById('shop-section').classList.toggle('hidden', tab === 'admin' || tab === 'reviews');
            document.getElementById('reviews-section').classList.toggle('hidden', tab !== 'reviews');
            document.getElementById('admin-section').classList.toggle('hidden', tab !== 'admin');

            if (tab === 'adopt' || tab === 'mm2') {
                document.getElementById('section-title').innerText = tab === 'adopt' ? 'Adopt Me' : 'MM2';
                loadProducts();
            } else if (tab === 'reviews') {
                loadReviews();
            }
        }

        function handleCheckAdminPass(e) {
            if (e) e.preventDefault();
            const passInput = document.getElementById('admin-pass');
            if (passInput.value === 'Roblox2604Rusla') {
                isAdmin = true;
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('admin-badge').classList.remove('hidden');
                alert('Вы успешно вошли как администратор!');
            } else {
                alert('Неверный пароль администратора!');
            }
        }

        function handleLogoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-pass').value = '';
            document.getElementById('admin-login').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-badge').classList.add('hidden');
            switchTab('adopt');
        }

        window.onFirebaseLoaded = function() {
            loadProducts();
        };

        function loadProducts() {
            if (!window.firebaseReady) return;

            const { ref, onValue } = window.fb;
            const productsRef = ref(window.rtdb, 'products');

            onValue(productsRef, (snapshot) => {
                const grid = document.getElementById('items-grid');
                const emptyState = document.getElementById('empty-shop-state');
                const countBadge = document.getElementById('items-count');
                
                grid.innerHTML = '';
                let count = 0;

                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach((key) => {
                        const item = { id: key, ...data[key] };
                        if (item.category === currentTab) {
                            count++;
                            grid.innerHTML += `
                                <div class="bg-slate-800 rounded-2xl border border-slate-700/80 overflow-hidden shadow-lg flex flex-col justify-between transition hover:border-slate-600">
                                    <div class="h-48 sm:h-52 bg-slate-900 overflow-hidden relative flex items-center justify-center">
                                        <img src="${item.img || 'https://via.placeholder.com/300?text=No+Image'}" class="w-full h-full object-cover">
                                    </div>
                                    <div class="p-4 flex flex-col flex-grow justify-between">
                                        <div>
                                            <h3 class="font-bold text-lg text-slate-100 line-clamp-2">${item.title}</h3>
                                            <p class="text-xl font-extrabold text-emerald-400 my-2">${item.price} <span class="text-sm font-normal">грн / ₴</span></p>
                                        </div>
                                        <div class="mt-3 pt-3 border-t border-slate-700/50">
                                            ${isAdmin ? `
                                                <button type="button" onclick="handleDeleteProduct('${item.id}')" class="w-full bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/30 font-semibold py-2 rounded-xl transition text-sm flex items-center justify-center gap-1.5 active:scale-95">
                                                    <i class="fa-solid fa-trash-can text-xs"></i> Удалить
                                                </button>
                                            ` : `
                                                <button type="button" onclick="handleBuyProduct('${item.title}')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition shadow-md shadow-indigo-600/20 active:scale-95">
                                                    Купить
                                                </button>
                                            `}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                }

                countBadge.innerText = `${count} товаров`;
                emptyState.classList.toggle('hidden', count > 0);
            });
        }

        // Функция сжатия изображений прямо в браузере перед отправкой
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function handleSaveProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-prod-submit');
            const title = document.getElementById('prod-title').value.trim();
            const price = document.getElementById('prod-price').value;
            const category = document.getElementById('prod-category').value;
            const fileInput = document.getElementById('prod-img');

            if (!window.firebaseReady) {
                alert('База данных еще подключается, подождите пару секунд...');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Обработка фото...';

            let imgData = '';
            if (fileInput.files[0]) {
                try {
                    // Автоматическое сжатие для быстрой работы
                    imgData = await compressImage(fileInput.files[0]);
                } catch (err) {
                    console.error("Ошибка при обработке фото:", err);
                }
            }

            btn.innerText = 'Сохранение товара...';

            try {
                const { ref, push } = window.fb;
                const productsRef = ref(window.rtdb, 'products');
                await push(productsRef, {
                    title,
                    price: Number(price),
                    category,
                    img: imgData,
                    createdAt: new Date().toISOString()
                });

                alert('Товар успешно сохранён в Realtime Database!');
                document.getElementById('product-form').reset();
                switchTab(category);
            } catch (err) {
                console.error(err);
                alert('Ошибка сохранения! Проверьте правила доступа в Realtime Database.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Опубликовать товар';
            }
        }

        async function handleDeleteProduct(id) {
            if (confirm('Удалить этот товар из базы?')) {
                try {
                    const { ref, remove } = window.fb;
                    await remove(ref(window.rtdb, 'products/' + id));
                } catch (e) {
                    alert('Ошибка при удалении');
                }
            }
        }

        function loadReviews() {
            if (!window.firebaseReady) return;

            const { ref, onValue } = window.fb;
            const reviewsRef = ref(window.rtdb, 'reviews');

            onValue(reviewsRef, (snapshot) => {
                const list = document.getElementById('reviews-list');
                list.innerHTML = '';

                const data = snapshot.val();
                if (!data) {
                    list.innerHTML = `<p class="text-slate-500 text-sm text-center py-4">Отзывов пока нет. Будьте первым!</p>`;
                    return;
                }

                Object.keys(data).forEach((key) => {
                    const rev = { id: key, ...data[key] };
                    const stars = '⭐'.repeat(Number(rev.rating) || 5);
                    list.innerHTML += `
                        <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700/60 flex justify-between items-start gap-3">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-bold text-slate-200">${rev.author}</span>
                                    <span class="text-xs text-amber-400">${stars}</span>
                                </div>
                                <p class="text-slate-300 text-sm">${rev.text}</p>
                            </div>
                            ${isAdmin ? `
                                <button type="button" onclick="handleDeleteReview('${rev.id}')" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 rounded bg-red-500/10">Удалить</button>
                            ` : ''}
                        </div>
                    `;
                });
            });
        }

        async function handleSaveReview(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-review-submit');
            const author = document.getElementById('rev-author').value.trim();
            const rating = document.getElementById('rev-rating').value;
            const text = document.getElementById('rev-text').value.trim();

            btn.disabled = true;

            try {
                const { ref, push } = window.fb;
                const reviewsRef = ref(window.rtdb, 'reviews');
                await push(reviewsRef, {
                    author,
                    rating,
                    text,
                    createdAt: new Date().toISOString()
                });

                alert('Спасибо за отзыв!');
                document.getElementById('review-form').reset();
            } catch (err) {
                alert('Не удалось отправить отзыв');
            } finally {
                btn.disabled = false;
            }
        }

        async function handleDeleteReview(id) {
            if (confirm('Удалить отзыв?')) {
                const { ref, remove } = window.fb;
                await remove(ref(window.rtdb, 'reviews/' + id));
            }
        }

        function handleBuyProduct(title) {
            alert(`Для покупки "${title}" свяжитесь с продавцом!`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.firebaseReady) {
                loadProducts();
            }
        });
    </script>
</body>
</html>
